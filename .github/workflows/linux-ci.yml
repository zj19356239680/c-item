name: Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install required system packages
        shell: bash
        run: |
          set -Eeuo pipefail
          package_output=$(bash scripts/install-deps.sh --print-system-packages)
          mapfile -t system_packages <<<"${package_output}"
          if ((${#system_packages[@]} == 0)); then
            echo "The system package list is empty" >&2
            exit 1
          fi
          for package in "${system_packages[@]}"; do
            if [[ ! "${package}" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]; then
              echo "Invalid system package name: ${package}" >&2
              exit 1
            fi
          done
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends "${system_packages[@]}"

      - name: Restore vcpkg binary cache
        # actions/cache v5.1.0 uses the Node.js 24 runtime.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Prepare cache directory
        run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

      - name: Install toolchain and dependencies
        run: bash scripts/install-deps.sh

      - name: Run quality gates
        run: bash scripts/check.sh

  container-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and verify container
        run: bash scripts/container-smoke.sh
