services:
  api-gate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: api-gate:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APIGATE_SERVICE_NAME: ${APIGATE_SERVICE_NAME:-api-gate}
      APIGATE_ENVIRONMENT: ${APIGATE_ENVIRONMENT:-production}
      APIGATE_LOG_LEVEL: ${APIGATE_LOG_LEVEL:-info}
      APIGATE_LISTEN_ADDRESS: 0.0.0.0
      APIGATE_LISTEN_PORT: 8080
    ports:
      - "127.0.0.1:${APIGATE_HOST_PORT:-8080}:8080"
    stop_grace_period: 10s
